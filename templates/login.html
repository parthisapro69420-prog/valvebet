{% extends "base.html" %}

{% block title %}Login - VaultBet{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Vault<span>Bet</span></h2>
            <p class="auth-subtitle">Log in to enter the virtual casino</p>
        </div>
        
        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/auth/login" method="post">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-input" required placeholder="Enter username">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-input" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn-primary">Log In</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="/auth/register">Register Now</a>
        </div>
    </div>
</div>
{% endblock %}
